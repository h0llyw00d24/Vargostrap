name: Feature Request
title: "[REQ] "
description: Suggest a feature that should be added
body:
  - type: markdown
    attributes:
      value: |
        ### **Preliminary instructions**
        - Please first check to see if your idea has already been suggested. You can check by [searching all previous issues](https://github.com/h0llyw00d24/Vargostrap/issues?q=is%3Aissue).
        - If your feature suggestion is to do with Roblox itself, please consider that Vargostrap only uses FastFlags on [Roblox's allowlist](https://devforum.roblox.com/t/allowlist-for-local-client-configuration-via-fast-flags/3966569) and settings Roblox exposes to players, and never modifies the Roblox client.
  - type: textarea
    id: what-happened
    attributes:
      label: What idea do you have?
    validations:
      required: true
